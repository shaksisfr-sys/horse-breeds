<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог пород лошадей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap');
        h1, h2, h3, .serif { font-family: 'Cormorant Garamond', serif; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col selection:bg-amber-700 selection:text-amber-100">

    <!-- Header -->
    <header class="bg-stone-900 border-b border-amber-900/40 sticky top-0 z-30 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-600 to-amber-900 flex items-center justify-center shadow-lg border border-amber-500/30">
                    <i class="fa-solid fa-horse-head text-amber-200 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-wide text-amber-100">Породы Лошадей</h1>
                    <p class="text-xs text-amber-400/80 font-medium">Иллюстрированный электронный каталог</p>
                </div>
            </div>
            
            <div class="relative w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="Поиск по названию, масти, стране..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-stone-950 border border-stone-800 rounded-xl text-amber-100 placeholder-stone-500 focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 text-sm transition">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-stone-500 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Navigation & Filters -->
    <div class="bg-stone-900/80 border-b border-stone-800 backdrop-blur-md sticky top-[77px] z-20">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap gap-2 justify-center" id="categoryFilters">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-amber-600 text-stone-950 shadow-md">Все породы</button>
            <button onclick="filterCategory('верховая')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-stone-800 text-stone-300 hover:bg-stone-700 hover:text-amber-300">Верховые</button>
            <button onclick="filterCategory('упряжная')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-stone-800 text-stone-300 hover:bg-stone-700 hover:text-amber-300">Упряжные</button>
            <button onclick="filterCategory('универсал')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-stone-800 text-stone-300 hover:bg-stone-700 hover:text-amber-300">Универсальные</button>
            <button onclick="filterCategory('пони')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-stone-800 text-stone-300 hover:bg-stone-700 hover:text-amber-300">Пони</button>
        </div>
    </div>

    <!-- Main Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <div id="notFound" class="hidden text-center py-20">
            <i class="fa-solid fa-compass text-5xl text-stone-700 mb-4"></i>
            <p class="text-stone-400 text-lg">Породы по вашему запросу не найдены</p>
        </div>
    </main>

    <!-- Modal Window -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-stone-900 border border-amber-900/40 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl text-stone-100 relative max-h-[90vh] flex flex-col">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-stone-950/70 hover:bg-amber-600 text-stone-300 hover:text-stone-950 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
            <div id="modalContent" class="overflow-y-auto"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-stone-900 border-t border-stone-800 py-6 text-center text-xs text-stone-500">
        <div class="max-w-7xl mx-auto px-4">
            Каталог пород лошадей © GitHub Pages
        </div>
    </footer>

    <script>
        const horses = [
            {
                id: 'akhalteke',
                name: 'Ахалтекинская',
                type: 'верховая',
                height: '155 - 163 см',
                colors: 'Буланая, соловая, изабелловая, вороная, серая',
                country: 'Туркменистан',
                image: 'images/akhalteke.jpg',
                description: 'Одна из древнейших чистокровных пород лошадей. Известна уникальным металлическим блеском шерсти, поджарым экстерьером, высокой выносливостью и пылким темпераментом.'
            },
            {
                id: 'orlov',
                name: 'Орловский рысак',
                type: 'упряжная',
                height: '157 - 170 см',
                colors: 'Серая в яблоках, вороная, гнедая, светло-серая',
                country: 'Россия',
                image: 'images/orlov.jpg',
                description: 'Знаменитая русская порода с гармоничным сложением и устойчивой рысью. Отличается грациозной лебединой шеей, гордой осанкой и универсальностью в использовании.'
            },
            {
                id: 'friesian',
                name: 'Фризская',
                type: 'универсал',
                height: '158 - 165 см',
                colors: 'Исключительно вороная (черная)',
                country: 'Нидерланды',
                image: 'images/friesian.jpg',
                description: '«Черные жемчужины» Фрисландии. Обладают невероятно пышной гривой и хвостом, длинными фризами на ногах и высоким, каретным ходом.'
            },
            {
                id: 'arabian',
                name: 'Арабская чистокровная',
                type: 'верховая',
                height: '145 - 155 см',
                colors: 'Серая, гнедая, рыжая, вороная',
                country: 'Аравийский п-ов',
                image: 'images/arabian.jpg',
                description: 'Древнейшая порода с узнаваемым «вогнутым» профилем головы, крупными глазами и высоко поднятым хвостом при движении. Обладает рекордной выносливостью.'
            },
            {
                id: 'shire',
                name: 'Шайр',
                type: 'упряжная',
                height: '165 - 185 см',
                colors: 'Вороная, гнедая, серая',
                country: 'Великобритания',
                image: 'images/shire.jpg',
                description: 'Самая крупная тяжелоупряжная порода лошадей в мире. Отличается невероятной физической силой, спокойным доброжелательным нравом и густыми фризами.'
            },
            {
                id: 'andalusian',
                name: 'Андалузская (PRE)',
                type: 'верховая',
                height: '155 - 162 см',
                colors: 'Преимущественно серая, гнедая',
                country: 'Испания',
                image: 'images/andalusian.jpg',
                description: 'Благородная порода Испании. Идеально подходит для классической выездки и высшей школы верховой езды благодаря природному балансу и мощной шее.'
            },
            {
                id: 'thoroughbred',
                name: 'Чистокровная верховая',
                type: 'верховая',
                height: '160 - 173 см',
                colors: 'Гнедая, рыжая, вороная, серая',
                country: 'Великобритания',
                image: 'images/thoroughbred.jpg',
                description: 'Самая быстрая порода лошадей в мире, способная развивать скорость свыше 60 км/ч. Создана специально для ипподромных скачек.'
            },
            {
                id: 'quarter',
                name: 'Квотерхорс',
                type: 'универсал',
                height: '142 - 160 см',
                colors: 'Рыжая, гнедая, буланая, чалая',
                country: 'США',
                image: 'images/quarter.jpg',
                description: 'Легендарная американская порода. Славится молниеносным стартовым рывком на коротких дистанциях, мускулистым крупом и работы с скотом (вестерн).'
            },
            {
                id: 'appaloosa',
                name: 'Аппалуза',
                type: 'верховая',
                height: '142 - 155 см',
                colors: 'Чубарая (пятнистая), мраморная',
                country: 'США',
                image: 'images/appaloosa.jpg',
                description: 'Выведена индейцами племени не-персе. Известна яркими пятнистыми узорами на шерсти, крапчатой кожей вокруг глаз и полосатыми копытами.'
            },
            {
                id: 'trakehner',
                name: 'Тракененская',
                type: 'верховая',
                height: '160 - 170 см',
                colors: 'Гнедая, вороная, рыжая, серая',
                country: 'Германия',
                image: 'images/trakehner.jpg',
                description: 'Элитная спортивная порода верховых лошадей. Блестяще выступает в конкуре, выездке и троеборье благодаря пластичным движениям.'
            },
            {
                id: 'don',
                name: 'Донская',
                type: 'универсал',
                height: '160 - 165 см',
                colors: 'Рыжая и бурая с золотистым отливом',
                country: 'Россия',
                image: 'images/don.jpg',
                description: 'Отечественная казачья порода степных лошадей. Отличается неприхотливостью, крепким здоровьем и характерным золотистым блеском шерсти.'
            },
            {
                id: 'vladimir',
                name: 'Владимирский тяжеловоз',
                type: 'упряжная',
                height: '165 - 170 см',
                colors: 'Гнедая, караковая, вороная',
                country: 'Россия',
                image: 'images/vladimir.jpg',
                description: 'Крупная тяжелоупряжная порода, выведенная в XX веке. Сочетает высокую грузоподъемность с размашистым и быстрым шагом.'
            },
            {
                id: 'shetland',
                name: 'Шетлендский пони',
                type: 'пони',
                height: '75 - 107 см',
                colors: 'Все масти',
                country: 'Шотландия',
                image: 'images/shetland.jpg',
                description: 'Одна из самых маленьких и сильных пород пони относительно своего веса. Обладает густым пышным мехом и спокойным темпераментом.'
            },
            {
                id: 'mustang',
                name: 'Мустанг',
                type: 'верховая',
                height: '140 - 150 см',
                colors: 'Гнедая, рыжая, саврасая, пегая',
                country: 'США',
                image: 'images/mustang.jpg',
                description: 'Очаровательные одичавшие лошади североамериканских прерий. Обладают стальным иммунитетом, быстрым умом и невероятной выносливостью.'
            },
            {
                id: 'hannoverian',
                name: 'Ганноверская',
                type: 'верховая',
                height: '160 - 175 см',
                colors: 'Гнедая, вороная, рыжая, серая',
                country: 'Германия',
                image: 'images/hannoverian.jpg',
                description: 'Самая успешная спортивная порода полукровок в мире. Занимает лидирующие позиции в мировых рейтингах по выездке и конкуру.'
            }
        ];

        let currentCategory = 'all';

        function renderCards() {
            const grid = document.getElementById('grid');
            const notFound = document.getElementById('notFound');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = horses.filter(h => {
                const matchCat = currentCategory === 'all' || h.type === currentCategory;
                const matchSearch = h.name.toLowerCase().includes(search) || 
                                    h.colors.toLowerCase().includes(search) ||
                                    h.country.toLowerCase().includes(search) ||
                                    h.type.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                notFound.classList.remove('hidden');
                return;
            }

            notFound.classList.add('hidden');
            grid.innerHTML = filtered.map(h => `
                <div onclick="openModal('${h.id}')" class="bg-stone-900 border border-stone-800/80 rounded-2xl overflow-hidden shadow-xl hover:border-amber-600/50 hover:shadow-amber-900/10 transition duration-300 cursor-pointer flex flex-col group">
                    <div class="relative h-60 bg-stone-950 overflow-hidden">
                        <img src="${h.image}" alt="${h.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" 
                            onerror="this.onerror=null; this.src='https://placehold.co/600x400/1c1917/d97706?text=Добавьте+${h.id}.jpg'">
                        <div class="absolute inset-0 bg-gradient-to-t from-stone-900 via-transparent to-transparent opacity-80"></div>
                        <span class="absolute top-3 right-3 bg-stone-950/80 backdrop-blur-sm text-amber-400 text-[11px] px-3 py-1 rounded-full border border-amber-900/40 uppercase tracking-wider font-semibold">
                            ${h.type}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex items-baseline justify-between gap-2 mb-1">
                                <h3 class="text-2xl font-bold text-amber-100 group-hover:text-amber-400 transition">${h.name}</h3>
                            </div>
                            <p class="text-xs text-stone-400 mb-3 flex items-center gap-1.5">
                                <i class="fa-solid fa-earth-americas text-amber-600/80"></i>${h.country}
                            </p>
                            
                            <div class="space-y-1.5 text-xs text-stone-300">
                                <p><span class="text-stone-500 font-medium">Рост в холке:</span> <strong class="text-amber-200">${h.height}</strong></p>
                                <p class="line-clamp-1"><span class="text-stone-500 font-medium">Масти:</span> ${h.colors}</p>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-stone-800/60 flex items-center justify-between text-xs font-semibold text-amber-500 group-hover:text-amber-400">
                            <span>Подробная информация</span>
                            <i class="fa-solid fa-arrow-right text-[10px] transform group-hover:translate-x-1 transition"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const h = horses.find(item => item.id === id);
            if (!h) return;

            document.getElementById('modalContent').innerHTML = `
                <div class="relative h-64 sm:h-72 bg-stone-950">
                    <img src="${h.image}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/1c1917/d97706?text=Добавьте+${h.id}.jpg'">
                    <div class="absolute inset-0 bg-gradient-to-t from-stone-900 via-stone-900/40 to-transparent"></div>
                    <div class="absolute bottom-5 left-6 right-6">
                        <span class="bg-amber-600 text-stone-950 text-[11px] px-3 py-1 rounded-full uppercase tracking-wider font-bold mb-2 inline-block">${h.type}</span>
                        <h2 class="text-3xl sm:text-4xl font-bold text-amber-100">${h.name}</h2>
                    </div>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-2 gap-4 bg-stone-950/60 p-4 rounded-xl border border-stone-800 text-sm">
                        <div>
                            <span class="text-stone-500 block text-xs mb-0.5">Рост в холке</span>
                            <span class="text-amber-300 font-semibold text-base">${h.height}</span>
                        </div>
                        <div>
                            <span class="text-stone-500 block text-xs mb-0.5">Страна происхождения</span>
                            <span class="text-amber-300 font-semibold text-base">${h.country}</span>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-amber-500 text-xs uppercase tracking-wider font-bold mb-2">Характерные масти</h4>
                        <p class="text-stone-300 text-sm bg-stone-950/30 p-3 rounded-lg border border-stone-800/40">${h.colors}</p>
                    </div>
                    <div>
                        <h4 class="text-amber-500 text-xs uppercase tracking-wider font-bold mb-2">О породе</h4>
                        <p class="text-stone-300 text-sm leading-relaxed">${h.description}</p>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-stone-800 text-stone-300 hover:bg-stone-700 hover:text-amber-300';
            });
            event.target.className = 'cat-btn px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition bg-amber-600 text-stone-950 shadow-md';
            renderCards();
        }

        document.getElementById('searchInput').addEventListener('input', renderCards);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        renderCards();
    </script>
</body>
</html>
