<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека пород лошадей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🐎 Библиотека пород лошадей</h1>
    <p>Нажмите на карточку, чтобы узнать подробнее</p>
    <input type="text" id="search" placeholder="Поиск породы...">
  </header>

  <main class="grid" id="grid"></main>

  <!-- Модальное окно -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" id="close">&times;</span>
      <img id="modal-img" src="" alt="">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>

  <footer class="footer">
    <p>Источник данных: svoefermerstvo.ru</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
